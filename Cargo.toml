[package]
name = "logtura-http-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An http_client-shaped HTTP poller with built-in OAuth refresh. Drop-in for Vector's exec source until upstream gets bearer_refresh / oauth_refresh."
license = "Apache-2.0"
repository = "https://github.com/logtura/logtura-http-client"
homepage = "https://github.com/logtura/logtura-http-client#readme"
authors = ["Erik Aronesty"]
readme = "README.md"
keywords = ["vector", "oauth", "http-client", "log-forwarder"]
categories = ["command-line-utilities"]

[lib]
name = "logtura_http_client_lib"
path = "src/lib.rs"

[[bin]]
name = "logtura-http-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
serde_json_path = "0.7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "z"
